# what is the goal of your workflow.
# Goal: Whenever someone changes  the python code, the linter will run and check the code for any errors or warnings.
# If there are any errors or warnings, it will fail the workflow and show the errors in the logs.
name: Auto Linter

on: 
  push: # this workflow will run on every push to the repository
    paths: "*.py" # if any python file is changed, the linter will run on .py files

jobs:
  code-linter:
    runs-on: ubuntu-latest
    steps:
      #this step will automatically clone the code from github current branch to the runner machine
      - name: Checkout/Clone the code
        uses: actions/checkout@v7 # this step will checkout the code from the repository to the runner machine

      - name: Install linter
        run: pip install ruff # this step will install the linter on the runner machine

      - name: Check the files for linting
        run: ruff check . #this step will run the linter on all the files in the current directory and sub-directories