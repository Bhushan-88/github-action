# workflow (no indentation required fo naming the workflow)
#should have name
name: Hello

# On tells when the should workflow run 
on:
  workflow_dispatch:  # This event allows you to manually trigger a workflow run. You can use the workflow_dispatch event to create a workflow that can be triggered by a user from the GitHub Actions tab in your repository.

# Jobs 
# should be inside workflow 
# Jobs tells what the workflow should do, there can be one or more than one jobs , hence we write job.
# jobs is an object so needs indentation
#1st job
jobs:
  say-hello: # Creaats an ephemeral container with ubuntu running 
    runs-on: ubuntu-latest # That ephemeral container will have steps to exicute, Hence name those steps and use run: , run has the command
    
    steps:
      - name: say hello to everyone
        run: echo "Hello Dosto"

# Steps
# should be inside a jobs

# Action
# should be inside the steps
